name: One-time Forgejo signing-secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer existing signing secrets to Forgejo
        env:
          FORGEJO_MIGRATION_TOKEN: ${{ secrets.FORGEJO_MIGRATION_TOKEN }}
          FORGEJO_URL: https://git.mandocloud.uk
          FORGEJO_REPO: Mr.Ares/Prox-ai-agent
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request, urllib.error, json
          token = os.environ.get("FORGEJO_MIGRATION_TOKEN", "")
          if not token:
              sys.exit("Missing FORGEJO_MIGRATION_TOKEN repository secret.")
          base = os.environ["FORGEJO_URL"].rstrip("/")
          repo = os.environ["FORGEJO_REPO"]
          names = ["ANDROID_KEYSTORE_BASE64","ANDROID_KEYSTORE_PASSWORD","ANDROID_KEY_ALIAS","ANDROID_KEY_PASSWORD","KEYSTORE_BASE64","KEYSTORE_PASSWORD","KEY_ALIAS","KEY_PASSWORD"]
          transferred, skipped = [], []
          for name in names:
              value = os.environ.get(name, "")
              if not value:
                  skipped.append(name)
                  continue
              url = f"{base}/api/v1/repos/{repo}/actions/secrets/{name}"
              body = json.dumps({"data": value}).encode()
              req = urllib.request.Request(url, data=body, method="PUT", headers={
                  "Authorization": "token " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status not in (200, 201, 204):
                          raise RuntimeError(f"HTTP {response.status}")
                  transferred.append(name)
              except urllib.error.HTTPError as e:
                  sys.exit(f"Transfer failed for secret name {name}: HTTP {e.code}. No secret values were printed.")
          print("Transferred secret names:", ", ".join(transferred) if transferred else "(none)")
          print("Skipped empty/unavailable secret names:", ", ".join(skipped) if skipped else "(none)")
          print("Secret values are never printed.")
          PY
