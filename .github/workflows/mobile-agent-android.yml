name: Build Prox AI Agent Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-agent/**'
      - '.github/workflows/mobile-agent-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build debug APK
        working-directory: mobile-agent
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prox-ai-agent-android-debug
          path: mobile-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
